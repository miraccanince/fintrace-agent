[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintrace-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128",
    "uvicorn>=0.40",
    "httpx>=0.28",
    "mcp>=2.2,<3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fintrace = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
